{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso - Chile Oscuro</title>
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>
<body class="dark-mode" style="display:flex; justify-content:center; align-items:center; min-height:100vh;">
    <div class="modal-content" style="max-width: 400px; width: 100%;">
        <h2 style="text-align:center; margin-bottom: 20px;">INICIAR SESIÓN</h2>
        <form method="POST">
            {% csrf_token %}
            <div style="display:flex; flex-direction:column; gap:15px;">
                {{ form.as_p }}
                <button type="submit" class="zona-btn" style="background:#c41e3a; color:#fff; text-align:center;">INGRESAR</button>
            </div>
        </form>
        <p style="text-align:center; margin-top:15px; font-size:12px;">
            ¿No tienes cuenta? <a href="{% url 'registro' %}" style="color:#c41e3a;">Regístrate aquí</a>
        </p>
        <p style="text-align:center; margin-top:10px;"><a href="{% url 'inicio' %}" style="color:#aaa; font-size:11px;">← Volver al inicio</a></p>
    </div>
</body>
</html>
